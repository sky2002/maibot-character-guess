[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "maibot-character-guess"
version = "0.1.0"
description = "MaiBot 五选回答猜角色，支持 Codex Luna 与 DeepSeek 服务端搜索"
requires-python = ">=3.12"
dependencies = ["maibot-plugin-sdk>=2.8.1,<3", "pydantic>=2.11,<3", "httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.setuptools]
packages = ["character_guess"]

[tool.setuptools.package-data]
character_guess = ["prompts/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
